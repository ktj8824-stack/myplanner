# 플레이 스토어 출시용 AAB 만들기 (손으로 실행: Actions > Android Release (AAB) > Run workflow)
# 결과: 이 실행의 Artifacts 에 MyPlanner-release.aab — 플레이 콘솔 '비공개 테스트'에 올리는 파일
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64       업로드 키 파일(.jks)을 base64로 바꾼 글자
#   ANDROID_KEYSTORE_PASSWORD  키 파일 비밀번호 (키 비밀번호도 같음)
#   ANDROID_KEY_ALIAS          키 이름 (기본 upload)
name: Android Release (AAB)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check secrets
        id: keys
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::warning::업로드 키(Secrets)가 아직 없어 '시험용 키'로 만들어요. 이 AAB는 플레이에 올리지 마세요 (빌드가 되는지 확인용)."
            echo "test=1" >> "$GITHUB_OUTPUT"
          else
            echo "test=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Android project (Capacitor) + 네이티브 알람
        run: |
          npx cap add android
          npm run cap-sync
      - name: Signing + version
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          UPLOAD_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.keys.outputs.test }}" = "1" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -alias upload -keyalg RSA -keysize 2048 -validity 1 -storepass testtest -keypass testtest -dname "CN=TEST" >/dev/null
          else
            # 붙여 넣을 때 섞인 줄바꿈·공백은 빼고 풀기
            printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" || { echo "::error::ANDROID_KEYSTORE_B64 값을 풀 수 없어요. txt 파일 내용 전체를 그대로 다시 붙여 넣어 주세요."; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_PW" >/dev/null || { echo "::error::키 파일 비밀번호(ANDROID_KEYSTORE_PASSWORD)가 맞지 않아요."; exit 1; }
          fi
          # 버전 번호: 실행할 때마다 1씩 올라감 (플레이는 같은 번호를 두 번 받지 않음)
          CODE=$((100 + ${{ github.run_number }}))
          NAME="1.0.${{ github.run_number }}"
          cat >> android/app/build.gradle <<EOF

          android {
              defaultConfig {
                  versionCode $CODE
                  versionName "$NAME"
              }
              signingConfigs {
                  upload {
                      storeFile file(System.getenv("UPLOAD_KS"))
                      storePassword System.getenv("UPLOAD_PW")
                      keyAlias System.getenv("UPLOAD_ALIAS") ?: "upload"
                      keyPassword System.getenv("UPLOAD_PW")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          EOF
          echo "versionCode=$CODE versionName=$NAME"
          grep -n "targetSdkVersion\|compileSdkVersion\|minSdkVersion" android/variables.gradle
      - name: Build AAB
        env:
          UPLOAD_KS: ${{ runner.temp }}/upload.jks
          UPLOAD_PW: ${{ steps.keys.outputs.test == '1' && 'testtest' || secrets.ANDROID_KEYSTORE_PASSWORD }}
          UPLOAD_ALIAS: ${{ steps.keys.outputs.test == '1' && 'upload' || secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          if [ "${{ steps.keys.outputs.test }}" = "1" ]; then OUT=MyPlanner-TEST-ONLY.aab; else OUT=MyPlanner-release.aab; fi
          cp app/build/outputs/bundle/release/app-release.aab ../$OUT
      - name: Clean key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keys.outputs.test == '1' && 'TEST-ONLY-do-not-upload' || 'MyPlanner-release-aab' }}
          path: MyPlanner-*.aab
          retention-days: 30
