# 안드로이드 앱(APK) 자동 만들기 — 로드플래너와 같은 방식
# 결과: 매 빌드 Actions artifact 'MyPlanner-apk'. 손으로 실행(workflow_dispatch)할 때만 Releases 'android-latest' 에도 올림
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: 테스트 APK는 광고를 테스트 광고로 (내 폰에서 실제 광고를 누르면 애드몹 정책 위반)
        run: |
          echo 'window.APP_CONFIG = Object.assign(window.APP_CONFIG || {}, { ADS_TEST_MODE: true });' > js/config.js
      - name: Android project (Capacitor) + 네이티브 알람
        run: |
          npx cap add android
          npm run cap-sync
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyPlanner-apk
          path: MyPlanner.apk
      # 디버그 APK를 공개 Releases에 올리는 건 손으로 돌릴 때(workflow_dispatch)만.
      # 평소 push 빌드는 위 artifact(로그인한 사람만 받을 수 있음)로만 남긴다.
      - name: Publish to release 'android-latest'
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 마이플래너 안드로이드 (테스트)
          body: |
            폰에서 MyPlanner.apk 를 눌러 내려받고 설치하세요. (처음 한 번 '출처를 알 수 없는 앱 설치 허용' 필요)
            빌드: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: MyPlanner.apk
